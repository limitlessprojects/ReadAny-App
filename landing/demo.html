<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ReadAny — no-key demo</title>
<meta name="description" content="See ReadAny's AI reading features end to end without an API key." />
<meta name="theme-color" content="#0e0e24" />
<style>
  :root { --bg:#0e0e24; --panel:#191938; --line:rgba(255,255,255,.1); --text:#f2f2fa; --muted:#a2a2c6; --accent:#ffb13d; --ink:#221503; --ok:#4ade80; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f1e7; --panel:#fffaf0; --line:rgba(0,0,0,.12); --text:#2b2418; --muted:#6b5f4a; --accent:#b4690e; --ink:#fff; --ok:#15803d; } }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
  .wrap { max-width:760px; margin:0 auto; padding:24px 18px 48px; }
  h1 { font-size:1.5rem; margin-bottom:6px; } .sub { color:var(--muted); margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px; }
  .passage { font-family:Georgia,"Times New Roman",serif; font-size:1.05rem; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  button.chip { font:inherit; font-weight:600; font-size:.9rem; padding:10px 14px; min-height:44px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer; }
  button.chip[aria-pressed="true"] { background:var(--accent); color:var(--ink); border-color:transparent; }
  .q { font-weight:600; margin-bottom:8px; } .a { min-height:3.2em; white-space:pre-wrap; }
  .badge { display:inline-block; margin-top:10px; font:600 .78rem ui-monospace,Menlo,Consolas,monospace; padding:5px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .badge.live { color:var(--ok); border-color:var(--ok); }
  .cta { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  a.btn { display:inline-flex; align-items:center; min-height:46px; padding:0 20px; border-radius:999px; font-weight:700; text-decoration:none; background:var(--accent); color:var(--ink); }
  a.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .note { color:var(--muted); font-size:.85rem; margin-top:14px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>ReadAny — no-key demo</h1>
  <p class="sub">Pick a question and watch the answer stream in. These are saved responses, so no API key is needed. The real app does this live on your own book.</p>

  <section class="card" aria-labelledby="ptitle">
    <h2 id="ptitle">Sample passage</h2>
    <p class="passage" id="passage"></p>
  </section>

  <div class="chips" id="chips" role="group" aria-label="Questions"></div>

  <section class="card" aria-live="polite">
    <h2>AI answer</h2>
    <p class="q" id="q">Choose a question above.</p>
    <p class="a" id="a"></p>
    <span class="badge" id="badge" hidden></span>
  </section>

  <div class="cta">
    <a class="btn" href="/app/">Open the real app</a>
    <a class="btn ghost" href="https://github.com/limitlessprojects/ReadAny-App#built-with-cerebras">How Cerebras was used</a>
  </div>
  <p class="note" id="note"></p>
</main>
<script>
(async function () {
  var $ = function (id) { return document.getElementById(id); };
  var cache;
  try {
    var r = await fetch("/demo-cache.json", { cache: "no-cache" });
    cache = await r.json();
  } catch (e) {
    $("q").textContent = "Could not load the demo data. Please reload.";
    return;
  }
  $("passage").textContent = cache.passage.text;
  $("ptitle").textContent = cache.passage.title;
  var live = cache.source === "cerebras";
  $("note").textContent = live
    ? "Answers were recorded from a real " + cache.model + " call on Cerebras; the badge shows the measured speed of that call."
    : "These are sample answers written for this demo, not a live model call. In the app, the same questions run against Gemini (free tier) or your own Cerebras key.";

  var timer = null, buttons = [];
  function show(item, btn) {
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
    clearInterval(timer);
    $("q").textContent = item.question;
    $("a").textContent = "";
    var badge = $("badge"); badge.hidden = true;
    var words = item.answer.split(/(\s+)/), i = 0;
    var perTick = 2;
    timer = setInterval(function () {
      i += perTick;
      $("a").textContent = words.slice(0, i).join("");
      if (i >= words.length) {
        clearInterval(timer);
        $("a").textContent = item.answer;
        badge.hidden = false;
        if (live && item.metrics) {
          badge.className = "badge live";
          badge.textContent = "⚡ " + item.metrics.ttftMs + " ms to first token · " + item.metrics.tokPerSec + " tok/s · " + cache.model + " (recorded)";
        } else {
          badge.className = "badge";
          badge.textContent = "Sample response — not a live call";
        }
      }
    }, 40);
  }
  cache.items.forEach(function (item) {
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.textContent = item.label;
    b.addEventListener("click", function () { show(item, b); });
    buttons.push(b); $("chips").appendChild(b);
  });
  if (buttons[0]) buttons[0].click();
})();
</script>
</body>
</html>
